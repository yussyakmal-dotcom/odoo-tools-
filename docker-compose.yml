services:
  api:
    build: .
    ports:
      - "127.0.0.1:700:8080"
    environment:
      BOM_DB_PATH: /app/data/bom_tools.sqlite3
      BOM_COOKIE_SECURE: ${BOM_COOKIE_SECURE:-false}
      BOM_SESSION_TTL_HOURS: ${BOM_SESSION_TTL_HOURS:-8}
    volumes:
      - bom_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build: .
    command: ["python", "-m", "odoo_tools.worker"]
    environment:
      BOM_DB_PATH: /app/data/bom_tools.sqlite3
    volumes:
      - bom_data:/app/data
    restart: unless-stopped

volumes:
  bom_data:
